[project]
name = "comfygit-env-h3-relay-fast-h3"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "comfyui-frontend-package==1.51.9",
    "comfyui-workflow-templates==0.11.50",
    "comfyui-embedded-docs==0.5.10",
    "torch",
    "torchsde",
    "torchvision",
    "torchaudio",
    "numpy>=1.25.0",
    "einops",
    "transformers>=4.50.3",
    "tokenizers>=0.13.3",
    "sentencepiece",
    "safetensors>=0.4.2",
    "aiohttp>=3.11.8",
    "yarl>=1.18.0",
    "pyyaml",
    "Pillow",
    "scipy",
    "tqdm",
    "psutil",
    "alembic",
    "SQLAlchemy>=2.0.0",
    "filelock",
    "av>=17.0.0",
    "comfy-kitchen==0.2.33",
    "comfy-aimdo==0.4.15",
    "requests",
    "simpleeval>=1.0.0",
    "blake3",
    "kornia>=0.7.1",
    "spandrel",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "PyOpenGL>=3.1.8",
    "comfy-angle",
]

[tool.comfygit]
schema_version = 2
comfyui_repository = "https://github.com/kijai/ComfyUI.git"
comfyui_version = "10febb01d7be73d1491cf5e5347b5ab8b6c2c09e"
comfyui_version_type = "commit"
comfyui_commit_sha = "10febb01d7be73d1491cf5e5347b5ab8b6c2c09e"
python_version = "3.11"
headless = true

[tool.comfygit.nodes.h3-relay]
name = "h3-relay"
repository = "https://github.com/akatz-ai/h3-relay.git"
version = "33ca879b8697605bedf6ed6875465239dfc46312"
source = "git"
criticality = "required"

[tool.comfygit.nodes.mmh3-ultimate]
