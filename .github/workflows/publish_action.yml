name: Publish to Comfy Registry

# Version tags publish automatically. Manual dispatch remains available for
# recovery after adding REGISTRY_ACCESS_TOKEN to the repository.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish H3 Relay
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'akatz-ai' && github.event.repository.fork == false }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Verify tag matches package version
        if: ${{ github.event_name == 'push' }}
        shell: bash
        run: |
          package_version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v${package_version}" = "${GITHUB_REF_NAME}"
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
