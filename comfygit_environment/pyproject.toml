[project]
name = "comfygit-env-h3-relay-reference"
version = "0.1.0"
requires-python = "==3.11.*"
dependencies = [
    "aiohttp>=3.11.8",
    "alembic",
    "av>=16.0.0",
    "blake3",
    "comfy-aimdo==0.4.13",
    "comfy-angle",
    "comfy-kitchen==0.2.31",
    "comfyui-embedded-docs==0.5.10",
    "comfyui-frontend-package==1.49.6",
    "comfyui-workflow-templates==0.11.41",
    "einops",
    "filelock",
    "kornia>=0.7.1",
    "numpy>=1.25.0",
    "pillow",
    "psutil",
    "pydantic~=2.0",
    "pydantic-settings~=2.0",
    "pyopengl>=3.1.8",
    "pyyaml",
    "requests",
    "safetensors>=0.4.2",
    "scipy",
    "sentencepiece",
    "simpleeval>=1.0.0",
    "spandrel",
    "sqlalchemy>=2.0.0",
    "tokenizers>=0.13.3",
    "torch",
    "torchaudio",
    "torchsde",
    "torchvision",
    "tqdm",
    "transformers>=4.50.3",
    "yarl>=1.18.0",
]

