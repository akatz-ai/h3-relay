name: Publish to Comfy Registry

# The first release is deliberately manual. Add REGISTRY_ACCESS_TOKEN to the
# repository, then dispatch this workflow from GitHub Actions.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-node:
    name: Publish H3 Relay
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'akatz-ai' && github.event.repository.fork == false }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4
      - name: Publish custom node
        uses: Comfy-Org/publish-node-action@v1
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
